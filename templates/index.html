<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GenOffice</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/socket.io/4.0.1/socket.io.js"></script>
    <style>
        :root {
            --bg: #353535;
            --panel: #252526;
            --accent: #007acc;
            --danger: #ff4444;
            --success: #4caf50;
            --text: #ffffff;
            --border: #333;
        }
        body { margin: 0; font-family: 'Segoe UI', sans-serif; background: var(--bg); color: var(--text); overflow: hidden; }
        
        .container { display: flex; height: 100vh; width: 100vw; overflow: hidden;}
        
        /* INPUT PANEL */
        #input-panel {
            width: 350px; min-width: 350px; background: var(--panel); padding: 30px; 
            border-right: 1px solid var(--border); z-index: 20;
            display: flex; flex-direction: column; gap: 15px;
            transition: margin-left 0.6s cubic-bezier(0.25, 1, 0.5, 1);
        }
        .panel-hidden { margin-left: -411px; }

        /* RIGHT PANEL */
        #right-panel {
            flex: 1; display: flex; flex-direction: column; position: relative;
            background: #000; transition: all 0.6s ease;
        }
        
        #top-status-bar {
            height: 60px; display: flex; align-items: center; justify-content: center;
            font-size: 1.5em; font-weight: bold; color: var(--accent);
            text-transform: uppercase; letter-spacing: 2px;
            text-shadow: 0 0 10px rgba(0, 122, 204, 0.5);
            text-align: center; padding: 0 20px;
        }

        #preview-stage {
            flex: 1; display: flex; position: relative; 
            transition: filter 0.8s ease, opacity 0.8s ease;
            overflow: hidden; 
        }

        .blur-active { filter: blur(15px); opacity: 0.3; }
        
        .preview-half { flex: 1; position: relative; overflow: hidden; }
        
        #slide-preview { 
            background: var(--bg); border-right: 1px solid var(--border); 
            display: flex; justify-content: center; align-items: center; 
        }
        
        #browser-preview { 
            background: #121212; display: flex; flex-direction: column; 
        }

        #bottom-control-bar {
            height: 80px; display: flex; align-items: center; justify-content: center; z-index: 15;
        }

        /* CONTROLS */
        input, select {
            background: #333; border: 1px solid #444; color: white; padding: 10px; width: 100%; box-sizing: border-box;
        }
        button {
            background: var(--accent); color: white; border: none; padding: 12px; font-weight: bold; cursor: pointer; border-radius: 4px;
        }
        button:hover { filter: brightness(1.1); }
        label { font-size: 0.8em; color: #ccc; }

        #stop-btn {
            background: var(--danger); padding: 10px 40px; border: 1px solid #ff6666; 
            font-size: 1.1em; display: none; box-shadow: 0 0 15px rgba(255, 68, 68, 0.4);
            cursor: pointer;
        }

        /* TOGGLE */
        .toggle-container {
            display: flex; align-items: center; justify-content: space-between;
            background: #333; padding: 10px; border-radius: 5px; border: 1px solid #444;
        }
        .switch { position: relative; display: inline-block; width: 40px; height: 20px; }
        .switch input { opacity: 0; width: 0; height: 0; }
        .slider {
            position: absolute; cursor: pointer; top: 0; left: 0; right: 0; bottom: 0;
            background-color: #555; transition: .4s; border-radius: 20px;
        }
        .slider:before {
            position: absolute; content: ""; height: 16px; width: 16px; left: 2px; bottom: 2px;
            background-color: white; transition: .4s; border-radius: 50%;
        }
        input:checked + .slider { background-color: var(--accent); }
        input:checked + .slider:before { transform: translateX(20px); }

        /* PREVIEW ELEMENTS */
        .paper {
            width: 80%; height: 60%; background: white; color: black; padding: 40px; 
            box-shadow: 0 0 20px rgba(0,0,0,0.5); position: relative; overflow: hidden;
        }
        .slide-title { font-size: 24px; font-weight: bold; margin-bottom: 20px; white-space: pre-wrap; }
        .slide-bullets { font-size: 16px; line-height: 1.5; white-space: pre-wrap; }
        
        .browser-bar { height: 50px; background: #2d2d30; display: flex; align-items: center; padding: 0 20px; flex-shrink: 0; }
        .url-bar { background: #3e3e42; flex: 1; height: 30px; border-radius: 4px; display: flex; align-items: center; padding-left: 10px; font-size: 12px; color: #aaa; }
        
        .image-grid { 
            display: grid; grid-template-columns: 1fr 1fr; gap: 10px; padding: 20px; 
            height: 160px; flex-shrink: 0;
        }
        .browser-img { width: 100%; height: 120px; object-fit: cover; border: 2px solid #333; opacity: 0; transition: opacity 0.3s; }
        .selected { border-color: var(--accent); box-shadow: 0 0 10px var(--accent); }

        /* TODO LIST */
        #todo-panel {
            flex: 1; background: #1a1a1a; border-top: 1px solid var(--border);
            padding: 20px; overflow-y: auto; font-family: monospace;
        }
        .todo-header { font-weight: bold; color: #888; margin-bottom: 10px; font-size: 0.9em; }
        .todo-item {
            display: flex; align-items: center; margin-bottom: 8px; color: #ccc;
            padding: 8px; background: #252526; border-radius: 4px; border-left: 3px solid #444;
            transition: all 0.3s ease;
        }
        .todo-checkbox {
            width: 18px; height: 18px; border: 2px solid #666; border-radius: 3px;
            margin-right: 10px; display: flex; align-items: center; justify-content: center;
            font-weight: bold; color: black; font-size: 12px;
        }
        
        .item-done { background: #1e3a29; border-left-color: var(--success); }
        .item-done .todo-checkbox { background: var(--success); border-color: var(--success); color: white; }
        .item-done .todo-text { text-decoration: line-through; color: #888; }
        
        .item-active { border-left-color: var(--accent); background: #2d2d30; color: white; }
        .item-active .todo-checkbox { border-color: var(--accent); }

        /* ANIMATIONS */
        @keyframes fly {
            0% { transform: scale(1); opacity: 1; top: 20%; left: 70%; position: absolute; }
            100% { transform: scale(0.5); opacity: 0; top: 50%; left: 20%; position: absolute; }
        }
        .flying-img { position: fixed; width: 200px; z-index: 999; animation: fly 1s forwards ease-in-out; }
        
        #download-modal {
            position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%);
            background: var(--panel); padding: 40px; border: 1px solid var(--accent);
            text-align: center; display: none; z-index: 200; box-shadow: 0 0 50px black;
        }

    </style>
</head>
<body>

<div class="container">
    <div id="input-panel">
        <h2>GenOffice AI</h2>
        
        <div>
            <label>Topic</label>
            <input type="text" id="topic" placeholder="e.g. History of Mars">
        </div>
        
        <!-- NEW FORMAT SELECTOR -->
        <div>
            <label>Output Format</label>
            <select id="fileFormat">
                <option value="pptx">PowerPoint (.pptx)</option>
                <option value="docx">Word Doc (.docx)</option>
                <option value="xlsx">Excel Sheet (.xlsx)</option>
            </select>
        </div>

        <div>
            <label>Language</label>
            <input type="text" id="lang" value="English">
        </div>
        <div>
            <label>Theme</label>
            <select id="theme">
                {% for t in themes %}
                    <option value="{{t}}">{{t}}</option>
                {% endfor %}
            </select>
        </div>
        <div>
            <label>Image Style</label>
            <input type="text" id="style" placeholder="e.g. realistic, blueprint">
        </div>

        <div>
            <label>Search Engine</label>
            <select id="searchEngine">
                <option value="bing" selected>Bing</option>
                <option value="duckduckgo">DuckDuckGo</option>
            </select>
        </div>

        <div class="toggle-container">
            <span style="font-weight:bold; color:#ccc;">Deep Thinking</span>
            <label class="switch">
                <input type="checkbox" id="deepMode">
                <span class="slider"></span>
            </label>
        </div>
        <div style="font-size: 0.7em; color: #777; margin-top: -10px;">
            Only applies to PowerPoint.
        </div>

        <button onclick="startGeneration()">GENERATE</button>
    </div>

    <div id="right-panel">
        <div id="top-status-bar"></div>
        <div id="preview-stage">
            <div class="preview-half" id="slide-preview">
                <div class="paper">
                    <div class="slide-title" id="s-title"></div>
                    <div class="slide-bullets" id="s-bullets"></div>
                </div>
            </div>
            <div class="preview-half" id="browser-preview">
                <div class="browser-bar">
                    <div class="url-bar" id="url-text">Search...</div>
                </div>
                <div class="image-grid" id="img-grid"></div>
                <div id="todo-panel">
                    <div class="todo-header">PROGRESS</div>
                    <div id="todo-list-container"></div>
                </div>
            </div>
        </div>
        <div id="bottom-control-bar">
            <button id="stop-btn" onclick="stopGeneration()">STOP</button>
        </div>
    </div>
</div>

<div id="download-modal">
    <h2 id="modal-title">SUCCESS!</h2>
    <p id="modal-msg">Your file is ready.</p>
    <a id="dl-link" href="#" target="_blank"><button id="dl-btn">DOWNLOAD</button></a>
    <br><br>
    <button onclick="resetUI()" style="background:#444">Create Another</button>
</div>

<script>
    const socket = io();
    const statusText = document.getElementById('top-status-bar');
    const previewStage = document.getElementById('preview-stage');
    const stopBtn = document.getElementById('stop-btn');
    const sTitle = document.getElementById('s-title');
    const sBullets = document.getElementById('s-bullets');
    const todoContainer = document.getElementById('todo-list-container');
    const imgGrid = document.getElementById('img-grid');

    function startGeneration() {
        const data = {
            topic: document.getElementById('topic').value,
            lang: document.getElementById('lang').value,
            theme: document.getElementById('theme').value,
            style: document.getElementById('style').value,
            deep_mode: document.getElementById('deepMode').checked,
            search_engine: document.getElementById('searchEngine').value,
            format: document.getElementById('fileFormat').value // SEND FORMAT
        };

        if(!data.topic) return alert("Please enter a topic");

        document.getElementById('input-panel').classList.add('panel-hidden');
        stopBtn.style.display = "block";
        previewStage.classList.add('blur-active'); 
        statusText.innerText = "INITIALIZING...";
        todoContainer.innerHTML = '<div style="color:#666;">Initializing...</div>';

        socket.emit('start_generation', data);
    }

    function stopGeneration() {
        socket.emit('stop_generation');
    }

    function resetUI() {
        document.getElementById('download-modal').style.display = "none";
        statusText.innerText = "";
        stopBtn.style.display = "none";
        document.getElementById('input-panel').classList.remove('panel-hidden');
        previewStage.classList.remove('blur-active');
        sTitle.innerText = "";
        sBullets.innerText = "";
        imgGrid.innerHTML = "";
    }

    // SOCKET LISTENERS
    socket.on('status_update', (data) => statusText.innerText = data.msg);

    socket.on('planner_init', (data) => {
        todoContainer.innerHTML = "";
        data.items.forEach((item, index) => {
            const div = document.createElement('div');
            div.className = "todo-item";
            div.id = `todo-${index}`;
            div.innerHTML = `<div class="todo-checkbox"></div><div class="todo-text">${item}</div>`;
            todoContainer.appendChild(div);
        });
    });

    socket.on('mark_done', (data) => {
        const item = document.getElementById(`todo-${data.index}`);
        if(item) {
            item.classList.add('item-done');
            item.querySelector('.todo-checkbox').innerText = "✔";
        }
        const nextItem = document.getElementById(`todo-${data.index + 1}`);
        if(nextItem) {
            nextItem.classList.add('item-active');
            nextItem.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
        }
    });

    socket.on('slide_type', (data) => {
        previewStage.classList.remove('blur-active');
        sTitle.innerText = data.title;
        sBullets.innerText = "";
        data.bullets.forEach(b => {
            sBullets.innerText += "• " + b + "\n";
        });
    });

    socket.on('browser_results', (data) => {
        imgGrid.innerHTML = "";
        data.images.forEach((src) => {
            const img = document.createElement('img');
            img.src = src;
            img.className = 'browser-img';
            imgGrid.appendChild(img);
            setTimeout(() => img.style.opacity = 1, 100);
        });
    });

    socket.on('finished', (data) => {
        stopBtn.style.display = "none";
        statusText.innerText = "DONE";
        previewStage.classList.remove('blur-active');
        document.getElementById('download-modal').style.display = "block";
        document.getElementById('dl-link').href = "/download/" + data.filename;
    });

    socket.on('stopped_by_user', () => {
        alert("Stopped.");
        resetUI();
    });

    socket.on('error', (data) => {
        alert("Error: " + data.msg);
        resetUI();
    });
</script>
</body>
</html>
